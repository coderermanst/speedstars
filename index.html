function stats(){mode='menu';const s=DB.st,S=DB.stats,nx=Math.pow(lvl(),2)*40,pv=Math.pow(lvl()-1,2)*40,nm={power:'Speed / Power',stamina:'Stamina',accel:'Acceleration',top:'Top speed',agility:'Agility',endurance:'Endurance'};
 show(`<div class=panel><h2>Statistics</h2>${back}<div class=card>Level ${lvl()} · ${DB.xp} XP<div class=bar><i style="width:${100*(DB.xp-pv)/(nx-pv)}%"></i></div>Points to spend: <b>${DB.pts}</b></div>${Object.keys(nm).map(k=>`<div class=row><span style="width:100px">${nm[k]}</span><div class=bar style="flex:1"><i style="width:${s[k]}%"></i></div><b style="flex:0 0 30px">${s[k]}</b><button ${(k!=='power'&&k!=='stamina'&&DB.pts&&s[k]<100)?'':'disabled'} onclick="DB.st.${k}++;DB.pts--;sv();stats()">${k==='power'||k==='stamina'?'AUTO':'+'}</button></div>`).join('')}<div class=row><span style="width:100px">Height</span><b>${ft(DB.ch.h)} (set in customiser)</b></div>
 <table><tr><td>Total races</td><td>${S.races}</td></tr><tr><td>Wins / trophies</td><td>${S.wins} / ${S.trophies}</td></tr><tr><td>Total distance</td><td>${(S.dist/1000).toFixed(2)} km</td></tr><tr><td>Top speed</td><td>${S.maxv.toFixed(1)} mph</td></tr><tr><td>Est. top speed (stats)</td><td>${mph(vmaxOf({st:s,h:DB.ch.h,sk:1})).toFixed(1)} mph</td></tr>${Object.keys(DB.pb).sort((a,b)=>a-b).map(d=>`<tr><td>PB ${d}m</td><td>${fmt(DB.pb[d])}</td></tr>`).join('')}</table></div>`)}
function ach(){mode='menu';show(`<div class=panel><h2>Achievements</h2>${back}${AC.map(a=>`<div class=card style="opacity:${DB.ach[a[0]]?1:.5}">${DB.ach[a[0]]?'🏆':'🔒'} <b>${a[1]}</b><br><small>${a[2]}</small></div>`).join('')}<h3>Unlocks</h3><div class=card>${Object.entries(LK).map(([k,v])=>`${k.replace(/(\D+)(\d)/,(m,a,b)=>a+' option '+b)}: level ${v}`).join('<br>')}<br>Stadiums: Blue Arena Lv5, Night Lights Lv8</div></div>`)}
function settings(){mode='menu';const s=DB.set,sl=(k,l,mx)=>`<div class=row><span style="width:110px">${l}</span><input type=range min=0 max=${mx} step=.1 value=${s[k]} oninput="DB.set.${k}=+this.value;sv()"></div>`;
 show(`<div class=panel><h2>Settings</h2>${back}<div class=row><span style="width:110px">Graphics</span><select onchange="DB.set.q=+this.value;sv();resize()">${['Low','Medium','High'].map((n,i)=>`<option value=${i} ${s.q==i?'selected':''}>${n}</option>`).join('')}</select></div>${sl('vol','Sound',1)}${sl('mus','Music',1)}${sl('sens','Camera speed',2)}
 <div class=row><span style="width:110px">Camera</span><select onchange="DB.set.cam=+this.value;sv()">${['Chase','Side','Front'].map((n,i)=>`<option value=${i} ${s.cam==i?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class=row><span style="width:110px">Touch pads</span><select onchange="DB.set.touch=+this.value;sv()"><option value=0 ${s.touch?'':'selected'}>Auto</option><option value=1 ${s.touch?'selected':''}>Always on</option></select></div>
 <button class=big onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Toggle fullscreen</button><div class=card>Keys: A / D, ← / →, Z / X alternate to take strides. Press C for camera. Tap L / R pads on touch screens.</div></div>`)}
/* drag rotate */
let dr=0;addEventListener('pointerdown',e=>{if(mode=='cust'&&e.target.id=='c'){dr=e.clientX}A()});addEventListener('pointermove',e=>{if(dr){cang-=(e.clientX-dr)*.01*DB.set.sens;dr=e.clientX}});addEventListener('pointerup',()=>dr=0);addEventListener('wheel',e=>{if(mode=='cust')czoom=Math.max(1.6,Math.min(6,czoom+e.deltaY*.004))});
/* loop */
let lt0=performance.now();function loop(n){const dt=Math.min(.05,(n-lt0)/1000);lt0=n;tick(dt);updModels(n/1000);if(!G&&window.PM&&mode!='race')poseIdle(PM,n/1000);camera(dt,n/1000);R.render(scene,cam);requestAnimationFrame(loop)}
resize();cam.position.set(1,1.4,5);menu();requestAnimationFrame(loop);
</script></body></html>
